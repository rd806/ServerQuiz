name: ServerQuiz
version: '2.0.0'
main: org.rd806.serverquiz.ServerQuiz
api-version: '1.20'
softdepend: [ Vault, PlaceholderAPI ]
authors: [ RunicDolphin806 ]

commands:
  serverquiz:
    aliases: quiz

permission:
  # Permission to answer quizzes
  serverquiz.open:
    default: true
  # Permission to view quiz information
  serverquiz.show:
    default: false
  # Permission to edit quizzes
  serverquiz.edit:
    default: false
