config:
  # Options: YAML, MYSQL
  storage: YAML
  # The config below is only available for MYSQL
  host: localhost
  port: 3306
  name: root
  password:
  # The database must be created in advance
  database: serverquiz
  useSSL: false
  # Quiz banks to load, in the listed order.
  # YAML:  reads quiz/<name>.yml under the plugin data folder.
  # MYSQL: reads the table with the same name in the database.
  # For MYSQL every table needs at least: id, question, answer, score, reward.
  # A MYSQL table containing option_a ~ option_d is loaded as a choice bank; otherwise it is a blank bank.
  # Add or remove banks here, then use /quiz reload to apply the change without restarting.
  table:
    - choice
    - blank

###########################################
##             Update checker            ##
###########################################

updateChecker:
  # Option: modrinth/github
  source: modrinth
  enable: true

##############################################
##            Broadcast messages            ##
##############################################

broadcast:
  # The text must be written in a single line
  text: "§e============\n§6§lNew Quiz begins! \n【Click here】 to join§r§e\n============"
  hover: "§7Click to join Server Quiz!"
  # When to broadcast the next quiz. Must be a quoted cron expression.
  # 5 fields: minute hour day-of-month month day-of-week
  # 6 fields: second minute hour day-of-month month day-of-week
  # Day of week: 0 or 7 = Sunday, 1-6 = Monday-Saturday.
  # Examples:
  #   "*/15 * * * *"   every 15 minutes
  #   "0 */2 * * *"    every 2 hours at minute 0
  #   "0 0 20 * * *"   every day at 20:00:00
  # If the expression is missing or invalid, the plugin falls back to 900 seconds.
  interval: "*/15 * * * *"

##############################################
##             Answer messages              ##
##############################################

messages:
  # A player has already given the correct answer
  hasWinner: "The quiz has already been solved!"
  # You have answered the quiz
  hasAnswered: "You have already answered this quiz!"
  # Your answer is right
  correct: "You have solved the quiz!"
  # Your answer is wrong
  wrong: "Your answer is wrong!"
  # Send Reward
  sendReward: "Reward has been sent to you: "
  # Send Economy Reward (only when Vault is available)
  sendEconomy: "Economy reward has been sent to you: "
  # Update player's score
  score: "Your score board has been updated!"
  # No option selected when submitting a choice quiz
  noSelection: "Please select at least one option!"
  # No quiz is available
  noQuiz: "There is no quiz available right now!"
  # The quiz changed while the GUI was open
  expired: "This quiz is no longer active!"

##############################################
##              The GUI text                ##
##############################################

gui:
  title: "Quiz Menu"
  question: "Question"
  reward: "Reward"
  score: "Score"
  # Available for choice quiz
  choice:
    option: "Option "
    # Whether to arrange options randomly
    random: true
    # The title of the selected answers display
    selected: "Selected"
    # The mark shown on a selected option
    selectedMark: "Selected"
    # The text shown when no option is selected
    noneSelected: "None"
    # The title of the submit button
    submit: "Submit"
  # Available for blank quiz
  blank:
    answerSheet: "Answer sheet"
    answerTitle: "Type your Answer"
  # Scoreboard settings
  scoreBoard:
    title: "§rYour quiz score board"
    # ServerQuiz has some built-in variables, which can be used here:
    # - %serverquiz_name% : the player's name
    # - %serverquiz_correct% : the number of questions correctly answered by the player
    # - %serverquiz_total% : the total number of questions answered by the player
    # - %serverquiz_accuracy% : the accuracy of the player answering questions
    # - %serverquiz_scores% : the scores the player has earned
    lore:
      - ""
      - "§ePlayer: §f %serverquiz_name%"
      - "§eCorrect: §f %serverquiz_correct%"
      - "§eTotal: §f %serverquiz_total%"
      - "§eAccuracy: §f %serverquiz_accuracy%"
      - "§eScores: §f %serverquiz_scores%"
