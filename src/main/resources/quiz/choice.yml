# Quiz bank type: choice (multiple choice) or blank (fill in the blank)
type: choice
# Entry fields match the MYSQL column names
entry:
  - question: "Which of the following is not a valid IP address?"
    option_a: "172.28.45.56"
    option_b: "192.168.0.1"
    option_c: "240e:360:6f43:500:d14d:dbd0:97:b3b3"
    option_d: "127.256.3.34"
    # Single answer: one label; multiple answers: comma-separated labels, e.g. "A,C" (order does not matter)
    answer: D
    score: 10
    reward: DIAMOND
  - question: "Which of the following file formats are not considered compressed files"
    option_a: "zip"
    option_b: "rar"
    option_c: "7z"
    option_d: "png"
    answer: D
    score: 10
    reward: DIAMOND
